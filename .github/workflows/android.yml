name: Android APK

on:
  push:
    branches: [main, android]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk homeguard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: homeguard-apk
          path: homeguard.apk
      - name: Publish as release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: HomeGuard Android ${{ github.run_number }}
          files: homeguard.apk
